# history limit
set -g history-limit 50000

# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Join windows

bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# tmux customisation (text)
set -g status-fg white
set -g status-bg "#6699ff"
set -g status-left "#S "
set -g status-right  " \"#{=22:pane_title}\" %H:%M %d-%b-%y"

# tmux logging
set -g @logging-path "~/tmux-logging"

# Automatically start logging for all newly created panes

# New tmux session (initial pane)
set-hook -g after-new-session \
    'run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'

# New window (initial pane)
set-hook -g after-new-window \
    'run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'

# New pane (horizontal or vertical split)
set-hook -g after-split-window \
    'run-shell "$HOME/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh"'

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
